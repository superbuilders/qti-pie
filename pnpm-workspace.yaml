# qti-pie as a repository of its own (superbuilders/qti-pie, a submodule of edullm and of metis): this file is read only
# when qti-pie is installed by itself, in its own checkout or trunk@qti-pie's worktree. Inside a consumer the consumer's
# pnpm-workspace.yaml is the workspace, its catalog the versions, and this file plays no part, as grizzle's does inside
# qti-pie. Its packages, grizzle's (the submodule vendor/grizzle, run from source) and the toolchain's dev tools and
# testing library (the submodule vendor/toolchain, at the one toolchain pin its consumers and grizzle share).
packages:
  - packages/*
  - vendor/grizzle/packages/engine
  - vendor/grizzle/packages/grizzle
  - vendor/grizzle/packages/openapi
  - vendor/grizzle/packages/pg
  - vendor/grizzle/packages/text
  - vendor/toolchain/packages/devtools
  - vendor/toolchain/packages/testing
catalogMode: strict
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@ui-sdk/core@0.1.0-beta.17"
  - "@ui-sdk/react@0.1.0-beta.17"
overrides:
  "@types/node": "catalog:"
# Every version a manifest of this workspace names by `catalog:` (qti-pie's packages, grizzle's and the toolchain's), at
# the consumer's version. A second copy of the consumers' catalog entries, kept equal by hand: README.md, "Installing
# qti-pie by itself", says how and why.
catalog:
  "@effect/language-service": 0.87.5
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.73.2
  "@effect/vitest": 4.1.4
  "@mdn/browser-compat-data": 8.1.11
  "@stylistic/eslint-plugin": 6.0.1
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@ui-sdk/core": 0.1.0-beta.17
  "@ui-sdk/react": 0.1.0-beta.17
  arkregex: 0.0.15
  effect: 4.1.4
  eslint-plugin-better-tailwindcss: 4.11.0
  linkedom: 0.18.15
  mathjax-full: 3.2.2
  mathlive: 0.105.3
  oxc-parser: 0.159.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  pg: 8.23.1
  playwright-core: 1.65.1
  quill: 2.0.3
  quill-delta: 5.1.0
  react: 19.3.1
  react-dom: 19.3.1
  saxes: 6.0.0
  tsrs: 7.1.0-beta.tsrs3
  typescript: 7.1.0-beta
  ultracite: 8.3.1
  vitest: 5.1.1
